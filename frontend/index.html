<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js). The calls below are queued in dataLayer right away; the 190 KB library itself loads on the
         first interaction or 3.5 s after the page has loaded, so it no longer competes with the page's own first render
         (it was the largest script and the main source of blocking time). It then sends the queued page view. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-MJPWGGEYJG');
      (function () {
        var done = false, events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function load() {
          if (done) return;
          done = true;
          events.forEach(function (e) { removeEventListener(e, load, true); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-MJPWGGEYJG';
          document.head.appendChild(s);
        }
        events.forEach(function (e) { addEventListener(e, load, { capture: true, passive: true, once: true }); });
        function later() { setTimeout(load, 3500); }
        if (document.readyState === 'complete') later(); else addEventListener('load', later, { once: true });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A1A3F" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="color-scheme" content="light" />
    <title>Coding Hubs School of AI</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Inter, Poppins and Noto Sans Devanagari are self-hosted (src/styles/fonts.css). Only the accent fonts
         (Caveat, JetBrains Mono for code) come from Google, loaded without blocking the first paint. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Home and program pages use the free-session design: load it as a parser-inserted (render-blocking) stylesheet so the first paint is already styled. It must sit after the app stylesheet in document order (hence in <body>), because free-session.css has to win over global.css. -->
    <script>
      if (/^\/(program\/.*|interview-studio)?$/.test(location.pathname)) {
        document.write('<link rel="stylesheet" href="/free-session.css?v=__FS_CSS_VERSION__">')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# --- HTTP: ACME challenge + redirects to HTTPS on the canonical host ---
server {
    listen 80;
    server_name ${SERVER_NAME} ${ADMIN_SERVER_NAME};

    # Let's Encrypt HTTP-01 challenge files (certbot writes here via the shared webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www is not a separate site: one canonical host (no duplicate content).
server {
    listen 80;
    server_name www.${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${SERVER_NAME}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.${SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    return 301 https://${SERVER_NAME}$request_uri;
}

# --- HTTPS: the site ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME} ${ADMIN_SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. Text files are precompressed at the highest gzip level during the build (scripts/precompress.mjs)
    # and served as-is by gzip_static; anything else (backend HTML, API JSON) is compressed on the fly at level 6
    # (nginx's default is 1). Brotli would need the ngx_brotli module, which the official nginx image does not ship.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/ld+json application/manifest+json application/xml text/xml text/plain image/svg+xml image/x-icon;

    # Real 404 status for URLs that are not pages (no soft-404s from an SPA fallback).
    error_page 404 /404.html;

    # Google Search Console ownership file (exact match beats the internal .html rule below; keep it forever).
    location = /google0d862ad3b2058a23.html {
        default_type text/html;
    }

    # Built HTML files are only served through the clean URLs below, never as /home.html, /faq.html, ...
    location ~ \.html$ {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Home page (prerendered). The admin subdomain opens straight on the admin panel.
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($host = ${ADMIN_SERVER_NAME}) {
            return 302 /admin-panel/;
        }
        try_files /home.html =404;
    }

    # Retired store and order pages must return a real 404, including account subroutes.
    location ~ ^/(store|cart|checkout|payment|my-account/(orders|downloads))(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # App-only routes (login and dashboards): SPA shell, kept out of search results.
    location = /interview-studio {
        add_header Cache-Control "no-cache";
        try_files /interview-studio/index.html =404;
    }
    location = /interview-studio/ {
        return 301 /interview-studio;
    }
    location /interview-studio/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ ^/(login|register|forgot-password|reset-password|dashboard|enroll|my-account|ai|gigs/workspace)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Admin panel: a separate app (admin-panel/ in the repo) built into /admin-panel/ of this image.
    location = /admin-panel {
        return 301 /admin-panel/;
    }
    location /admin-panel/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri /admin-panel/index.html;
    }
    location ~* "^/admin-panel/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Preserve every legacy nested Interview URL and its query string.
    rewrite ^/interview-prep(?:/(.*))?$ /interview/$1 permanent;

    # Trailing-slash variants of file-style routes go to the clean URL.
    rewrite ^/(courses|interview)(/[^/.]+)?$ /$1$2/ permanent;
    rewrite ^(/interview/[a-z0-9-]+/levels/[1-4](?:/(?:articles/[a-z0-9-]+|days/[0-9]+))?)$ $1/ permanent;
    # Certificates now live inside Interview
    rewrite ^/certificates/?$ /interview/ permanent;
    rewrite ^/certificates/([^/]+)/?$ /interview/$1/ permanent;
    rewrite ^/(policies|blog|case-studies|store|projects|project-guides|program/[^/]+)/$ /$1 permanent;
    rewrite ^/(blog|case-studies|store|projects|project-guides)/([^/]+)/$ /$1/$2 permanent;
    rewrite ^/book-a-tutor$ /book-a-tutor/ permanent;

    rewrite ^/gigs/$ /gigs permanent;
    rewrite ^/gigs/([^/]+)/$ /gigs/$1 permanent;

    # Pilot listings are backend-rendered and always noindex. The private workspace matches the app-only block above.
    location ~ ^/gigs(/[^/]+)?$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location ~ ^/newsletter/(confirm|unsubscribe)/?$ {
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    rewrite ^/(newsletter|brochures)$ /$1/ permanent;

    location ~ ^/(newsletter|brochures)(?:/|$) {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog, case studies, projects and guides live in the database: the backend answers with crawler-ready HTML (see backend/apps/content/ssr.py).
    location ~ ^/(blog|case-studies|projects|project-guides)(/[^/]+)?$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap-(content|shop|learning|directory)\.xml$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images (shared volume written by the backend). Served as plain images only.
    location ~ ^/learn(?:/|$) {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /visual-lab {
        return 301 /visual-lab/$is_args$args;
    }
    location = /visual-lab/ {
        try_files /visual-lab/index.html =404;
    }

    # FAQ is a prerendered page again (faq.html), reachable at /faq and /faq/.
    location = /faq {
        add_header Cache-Control "no-cache";
        try_files /faq.html =404;
    }
    location = /faq/ {
        return 301 /faq;
    }

    # AI Tools directory (prerendered ai-tools.html), reachable at /ai-tools and /ai-tools/.
    location = /ai-tools {
        add_header Cache-Control "no-cache";
        try_files /ai-tools.html =404;
    }
    location = /ai-tools/ {
        return 301 /ai-tools;
    }

    # Demo videos (prerendered demo-videos.html), reachable at /demo-videos and /demo-videos/.
    location = /demo-videos {
        add_header Cache-Control "no-cache";
        try_files /demo-videos.html =404;
    }
    location = /demo-videos/ {
        return 301 /demo-videos;
    }

    # Our Work portfolio (prerendered our-work.html), reachable at /our-work and /our-work/.
    location = /our-work {
        add_header Cache-Control "no-cache";
        try_files /our-work.html =404;
    }
    location = /our-work/ {
        return 301 /our-work;
    }

    location ^~ /media/ {
        alias /var/www/media/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # AVIF variants: explicit MIME type (independent of the image's mime.types version), same cache rules as other media.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.avif$" {
        types { image/avif avif; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* ^/(assets|fs-assets|img)/.+\.avif$ {
        types { image/avif avif; }
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Fingerprinted build files never change: cache for a year. Vite also emits hashed fonts at the top of /assets/
    # (public/ images there and in subfolders keep fixed names and fall through to the one-week rule below).
    location ~* "^/assets/(.+-[A-Za-z0-9_-]{8}\.(js|css)|[^/]+-[A-Za-z0-9_-]{8}\.(woff2|png|jpe?g|webp|avif|svg))$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # free-session.css is referenced with ?v=<content hash>, so it can be cached the same way.
    location = /free-session.css {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, icons and videos with fixed names: 30 days, then served from cache while the browser re-checks.
    location ~* ^/(assets|fs-assets|img)/.+\.(jpe?g|png|webp|svg|ico|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Public directory records need real content, self canonicals and record-aware 404s.
    location ~ ^/(book-a-tutor|latest-jobs)(/[^/]+)?/?$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /program/x -> program/x.html, /locations/x/ -> locations/x/index.html, anything else -> 404.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Brochure files default to 10 MB; allow multipart overhead while keeping the backend's actual file limit authoritative.
    location ^~ /api/admin/courses/ {
        client_max_body_size 12m;
        proxy_pass http://${BACKEND_HOST}/api/admin/courses/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        client_max_body_size 8m;
        proxy_read_timeout 75s;  # AI endpoints can take up to ~45s; gunicorn's timeout is 90s
        proxy_pass http://${BACKEND_HOST}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://${BACKEND_HOST}/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://${BACKEND_HOST}/static/;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

# Internal only (not published by docker-compose): the backend fetches the app shell here to wrap server-rendered blog pages.
server {
    listen 8081;
    root /usr/share/nginx/html;
    location = /__shell.html {
        try_files /content-shell.html =404;
    }
    location / {
        return 404;
    }
}

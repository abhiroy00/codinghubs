# --- HTTP: ACME challenge + redirects to HTTPS on the canonical host ---
server {
    listen 80;
    server_name ${SERVER_NAME} ${ADMIN_SERVER_NAME};

    # Let's Encrypt HTTP-01 challenge files (certbot writes here via the shared webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www is not a separate site: one canonical host (no duplicate content).
server {
    listen 80;
    server_name www.${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${SERVER_NAME}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.${SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    return 301 https://${SERVER_NAME}$request_uri;
}

# --- HTTPS: the site ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME} ${ADMIN_SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml text/plain image/svg+xml;

    # Real 404 status for URLs that are not pages (no soft-404s from an SPA fallback).
    error_page 404 /404.html;

    # Google Search Console ownership file (exact match beats the internal .html rule below; keep it forever).
    location = /google0d862ad3b2058a23.html {
        default_type text/html;
    }

    # Built HTML files are only served through the clean URLs below, never as /home.html, /faq.html, ...
    location ~ \.html$ {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Home page (prerendered). The admin subdomain opens straight on the admin panel.
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($host = ${ADMIN_SERVER_NAME}) {
            return 302 /admin-panel/;
        }
        try_files /home.html =404;
    }

    # App-only routes (login, checkout, dashboards): SPA shell, kept out of search results.
    location ~ ^/(login|register|dashboard|courses|cart|checkout|payment|my-account)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Admin panel: a separate app (admin-panel/ in the repo) built into /admin-panel/ of this image.
    location = /admin-panel {
        return 301 /admin-panel/;
    }
    location /admin-panel/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri /admin-panel/index.html;
    }
    location ~* "^/admin-panel/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Trailing-slash variants of file-style routes go to the clean URL.
    rewrite ^/(faq|policies|blog|case-studies|store|projects|project-guides|program/[^/]+)/$ /$1 permanent;
    rewrite ^/(blog|case-studies|store|projects|project-guides)/([^/]+)/$ /$1/$2 permanent;
    rewrite ^/book-a-tutor$ /book-a-tutor/ permanent;

    # Blog, case studies, projects, guides and the store live in the database: the backend answers with crawler-ready HTML (see backend/apps/content/ssr.py).
    location ~ ^/(blog|case-studies|store|projects|project-guides)(/[^/]+)?$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap-(content|shop)\.xml$ {
        proxy_pass http://${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images (shared volume written by the backend). Served as plain images only.
    location ^~ /media/ {
        alias /var/www/media/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # Fingerprinted build files never change: cache for a year.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # free-session.css is referenced with ?v=<content hash>, so it can be cached the same way.
    location = /free-session.css {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, icons and videos with fixed names: a week.
    location ~* ^/(assets|fs-assets)/.+\.(jpe?g|png|webp|svg|ico|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # /faq -> faq.html, /program/x -> program/x.html, /locations/x/ -> locations/x/index.html, anything else -> 404.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location ^~ /api/ {
        client_max_body_size 8m;
        proxy_pass http://${BACKEND_HOST}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://${BACKEND_HOST}/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://${BACKEND_HOST}/static/;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

# Internal only (not published by docker-compose): the backend fetches the app shell here to wrap server-rendered blog pages.
server {
    listen 8081;
    root /usr/share/nginx/html;
    location = /__shell.html {
        try_files /content-shell.html =404;
    }
    location / {
        return 404;
    }
}

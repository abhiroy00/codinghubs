name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py test apps
        working-directory: backend
        env:
          SECRET_KEY: ci-test-key-not-for-prod-use-only
          DEBUG: 'True'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      - name: Validate location pages (word count, metadata, links, sitemap)
        run: npm run validate:locations
        working-directory: frontend

  deploy:
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/codinghubs-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codinghubs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_RAZORPAY_KEY_ID=${{ vars.VITE_RAZORPAY_KEY_ID }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/codinghubs-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codinghubs-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters "commands=[\"curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/infra/deploy-remote.sh | bash -s -- ${{ github.sha }}\"],executionTimeout=[\"900\"]" \
            --comment "deploy ${{ github.sha }}" \
            --query 'Command.CommandId' --output text)
          echo "command id: $CMD_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text
                exit 1 ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text

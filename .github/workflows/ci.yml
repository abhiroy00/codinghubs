name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py test apps
        working-directory: backend
        env:
          SECRET_KEY: ci-test-key-not-for-prod-use-only
          DEBUG: 'True'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      - name: SEO validation (site-wide metadata, canonicals, sitemap, robots, links) and location pages (word counts, uniqueness)
        run: npm run validate
        working-directory: frontend
      - name: Upload tutor page stylesheet for deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: tutor-page-css
          path: frontend/dist/assets/BookTutor-*.css
          if-no-files-found: error
          retention-days: 1

  admin-panel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
        working-directory: admin-panel
      - run: npm run build
        working-directory: admin-panel

  deploy:
    needs: [backend-tests, frontend-build, admin-panel-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: codinghubs-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download tutor page stylesheet
        uses: actions/download-artifact@v4
        with:
          name: tutor-page-css
          path: tutor-page-css

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/codinghubs-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codinghubs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_RAZORPAY_KEY_ID=${{ vars.VITE_RAZORPAY_KEY_ID }}
            VITE_TINYMCE_API_KEY=${{ vars.VITE_TINYMCE_API_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/codinghubs-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codinghubs-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        run: |
          SHA="${{ github.sha }}"
          LOGS_CMD="df -h / | tail -2; for log in \$(ls -t /opt/codinghubs/deploy-logs/*.log 2>/dev/null | head -3); do echo \"--- \$log ---\"; tail -n 60 \"\$log\"; done"
          remote() {
            local params id st
            params=$(jq -nc --arg command "$1" '{commands:[$command],executionTimeout:["60"]}')
            id=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" --document-name "AWS-RunShellScript" \
              --timeout-seconds 60 --parameters "$params" --comment "ci diagnostics" --query 'Command.CommandId' --output text) || return 0
            for _ in $(seq 1 12); do
              st=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query 'Status' --output text 2>/dev/null || echo Pending)
              if [ "$st" = Success ]; then
                aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query 'StandardOutputContent' --output text
                return 0
              fi
              case "$st" in Failed|Cancelled|TimedOut) echo "diagnostics command $st"; return 0 ;; esac
              sleep 5
            done
          }
          echo "=== latest deployment logs on the server (before this deploy) ==="
          remote "$LOGS_CMD"

          DEPLOY_COMMAND="mkdir -p /opt/codinghubs/deploy-logs && systemd-run --unit=codinghubs-deploy-${SHA} --collect --no-block /bin/bash -lc 'exec > /opt/codinghubs/deploy-logs/${SHA}.log 2>&1; set -euo pipefail; curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/infra/deploy-remote.sh -o /tmp/codinghubs-deploy-${SHA}.sh; bash /tmp/codinghubs-deploy-${SHA}.sh ${SHA}'"
          PARAMETERS=$(jq -nc --arg command "$DEPLOY_COMMAND" '{commands:[$command],executionTimeout:["120"]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --parameters "$PARAMETERS" \
            --comment "deploy $SHA" \
            --query 'Command.CommandId' --output text)
          echo "command id: $CMD_ID"

          SSM_STATUS=Pending
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) SSM_STATUS=Success; break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text
                exit 1 ;;
            esac
            sleep 5
          done

          if [ "$SSM_STATUS" != Success ]; then
            echo "SSM did not confirm the deployment launch within 2 minutes."
            remote "$LOGS_CMD"
            exit 1
          fi

          CSS_PATH=$(find tutor-page-css -maxdepth 1 -name 'BookTutor-*.css' -print -quit)
          CSS_FILE=${CSS_PATH##*/}
          if [ -z "$CSS_FILE" ]; then
            echo "Tutor stylesheet artifact was not found."
            exit 1
          fi
          CSS_URL="https://codinghubs.in/assets/$CSS_FILE"
          for i in $(seq 1 90); do
            if curl --connect-timeout 3 --max-time 5 -fsSL "$CSS_URL" -o deployed-tutor.css && grep -q 'max-height:calc(100dvh - 1.5rem)' deployed-tutor.css; then
              echo "Verified deployed tutor stylesheet: $CSS_URL"
              exit 0
            fi
            echo "Waiting for tutor page asset: $CSS_URL"
            sleep 10
          done
          echo "Tutor page stylesheet was not deployed within 15 minutes: $CSS_URL"
          echo "=== deployment log on the server ==="
          remote "$LOGS_CMD"
          exit 1

name: Deployment diagnostics
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Release commit to inspect
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read release log and container states
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          COMMAND="tail -n 100 /opt/codinghubs/deploy-logs/${RELEASE_SHA}.log; cd /opt/codinghubs && docker compose -f docker-compose.prod.yml --env-file .env --profile learning ps --format '{{.Service}} {{.State}} {{.Health}} {{.Image}}'"
          PARAMETERS=$(jq -nc --arg command "$COMMAND" '{commands:[$command],executionTimeout:["60"]}')
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMETERS" --query Command.CommandId --output text)
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = Success ]; then
              aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
              exit 0
            fi
            case "$STATUS" in Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}'; exit 1 ;; esac
            sleep 3
          done
          exit 1

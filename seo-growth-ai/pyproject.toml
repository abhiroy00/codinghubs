[project]
name = "codinghubs-local-seo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "defusedxml>=0.7,<1", "openpyxl>=3.1,<4",
  "cryptography>=50,<51", "argon2-cffi>=23,<26", "psutil>=6,<8",
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "networkx>=3.4,<4",
  "langgraph>=0.4,<2", "celery[redis]>=5.5,<6", "prometheus-client>=0.21,<1", "pyyaml>=6,<7",
  "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
